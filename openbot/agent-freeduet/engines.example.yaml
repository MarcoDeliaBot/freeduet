# FreeDuet engines. Copy to engines.yaml and adjust. See docs/PROVIDERS.md before enabling any route.
#
# THE RULE: logins first. Subscriptions you signed in to yourself are always tried first.
# API keys and API credits (including the credits that come with a Claude plan) are optional: they run
# only if you switch them on, only after every login engine in the chain, and only under your caps.
#
# kind:     cli | app-server | acp | anthropic-api | openai-compatible | anthropic-compatible
# billing:  subscription | free | metered
# tier:     A (best), B, C. Members can require a minimum tier for some skills.
# enabled:  the kill switch. Routes whose provider terms are unclear ship with enabled: false.

engines:
  # ── Logins (subscriptions): tried first ──────────────────────────────────────────────────────
  claude-code:
    kind: cli
    command: claude
    billing: subscription          # your own Claude Pro, Max, Ultra or Team login
    tier: A
    enabled: true

  codex:
    kind: app-server
    command: codex
    billing: subscription          # your own ChatGPT plan
    tier: A
    enabled: false                 # planned, not built: on once its checks pass (PROVIDERS.md)
    experimental_local_login: false

  gemini-cli:
    kind: acp
    command: gemini
    billing: subscription
    tier: A
    enabled: false                 # off: see docs/PROVIDERS.md (Google)
    locked_reason: "Provider terms do not allow third-party software to use Gemini CLI's sign-in."

  # ── Free: your own hardware ──────────────────────────────────────────────────────────────────
  local:
    kind: openai-compatible
    base_url: http://host.docker.internal:11434/v1    # Ollama on the same machine
    billing: free
    model: "<local-model-name>"     # any model you pulled into Ollama
    tier: C
    enabled: false

  openrouter-free:
    kind: openai-compatible
    base_url: https://openrouter.ai/api/v1
    credential_secret_ref: openrouter-api-key
    billing: free
    model: "<free-model-id>"        # a model marked free on openrouter.ai; the provider's limits apply
    tier: C
    enabled: false

  # ── An Anthropic-compatible endpoint you name: the same Claude Code CLI, on your own key at that endpoint (or none, on this machine) ──
  # The blocks below are examples and stay off. To use one: uncomment it, set `enabled: true` and write its name in a
  # chain under `chains:` below, after `claude-code`. The member runs exactly as on `claude-code` (same lockdown, same
  # tools, same approvals); only where it sends its requests, which key it sends and which model it asks for change.
  # The key is one you hold at that endpoint, never your Claude sign-in: write where to find it (`env:NAME` for a
  # variable of this service, `file:/absolute/path` for a file that holds it, in no folder whose name starts with a
  # dot), never the key itself. `billing` has no default and is never guessed: say whether the endpoint is free or
  # paid. It is your own statement, because FreeDuet cannot see what an endpoint charges: write `metered` for anything
  # that can charge you.
  # A PAID ENDPOINT IS NOT RUN YET. FreeDuet keeps the limits you set with a spend ledger (see `metered:` below), but the
  # lock in front of it is closed in this release, so a `billing: metered` endpoint
  # is refused whatever the `metered:` block below says: nothing starts it, and the log, the chat and the engine list say so.
  # The `metered:` block is still read and checked, so what you write now keeps its meaning when the lock is opened.
  # Free endpoints and your own logins work.
  # It is never first in a chain (logins come first), and `tier` is C unless you say otherwise: the quality floor
  # keeps a skill that needs a better model off it. Plain http is accepted only for this machine; anything else is https.
  #
  # A paid gateway, as it would be written once its limits can be kept (with `metered.enforce: ledger` below). Refused for now.
  # my-gateway:
  #   kind: anthropic-compatible
  #   base_url: https://openrouter.ai/api               # the address a Claude Code client is given, without /v1/messages
  #   credential_secret_ref: env:MY_GATEWAY_KEY
  #   billing: metered
  #   model: "<model-id-at-the-gateway>"                # the one model every request asks for
  #   tier: C
  #   enabled: false
  #
  # A local free router is a tool you install yourself that puts one address and one key in front of several free
  # providers (for example FreeLLMAPI). FreeDuet neither ships nor installs it, and the terms of the providers behind
  # it are yours to respect. Such a router may be a later link in a chain, never the first. Its own default port, 3001,
  # is the port FreeDuet's server uses, so start the router on another one (3002 here). From a container, `localhost`
  # is the container itself: use host.docker.internal for a router on this machine.
  #
  # local-free-router:
  #   kind: anthropic-compatible
  #   base_url: http://host.docker.internal:3002
  #   credential_secret_ref: env:LOCAL_ROUTER_KEY
  #   billing: free
  #   model: "<model-id-the-router-lists>"
  #   tier: C
  #   enabled: false
  #
  # A model on your own computer, through Ollama's Anthropic-compatible endpoint (Ollama 0.14 and later serve /v1/messages).
  # It takes no key, so write `no_key: true` and leave the key line out: FreeDuet then sends a placeholder that the local
  # server ignores, and accepts that only for a plain http:// address on this machine (localhost, 127.x.x.x, ::1) or for
  # host.docker.internal. From the container `localhost` is the container itself, so use host.docker.internal. On Linux the
  # local server must listen on an address the container can reach: Ollama listens on 127.0.0.1 by default, so start it with
  # OLLAMA_HOST=0.0.0.0:11434 (on systemd: Environment="OLLAMA_HOST=0.0.0.0:11434").
  # Write the name of a model you pulled (`ollama list`). Whether it calls tools well is not checked here: it stays tier C
  # until the team evals pass on it. Write `metered` instead of `free` for a server that forwards to paid providers.
  # local-models:
  #   kind: anthropic-compatible
  #   base_url: http://host.docker.internal:11434
  #   no_key: true
  #   billing: free
  #   model: "<model-name-you-pulled>"
  #   tier: C
  #   enabled: false

  # ── Metered (API keys and API credits): optional, always last ─────────────────────────────────
  anthropic-api:
    kind: anthropic-api
    credential_secret_ref: anthropic-api-key   # also how you use the API credits included in Max, Ultra, Team
    billing: metered
    model: claude-sonnet-5-5
    tier: A
    enabled: false                 # your choice: switch on to use API credits as a last resort

  kimi-api:
    kind: openai-compatible
    base_url: https://api.moonshot.ai/v1
    credential_secret_ref: moonshot-api-key
    billing: metered
    model: "<kimi-model-id>"        # any model listed in Moonshot's docs
    tier: B
    enabled: false

  openrouter:
    kind: openai-compatible
    base_url: https://openrouter.ai/api/v1
    credential_secret_ref: openrouter-api-key
    billing: metered
    model: "<openrouter-model-id>"  # any model id listed on openrouter.ai/models
    tier: B
    enabled: false

# Metered engines run only when enabled here, only after every login engine in the chain has been
# tried, and only under the caps. Off by default. 0 means never.
#
# A PAID `anthropic-compatible` GATEWAY IS NOT RUN YET, whatever is written here; the block is still read and
# checked. It would run only when ALL of these hold: this block says `enabled: true`, both caps above 0 and `enforce: ledger`;
# the maintainer has opened the switch in freeduet/engines.py (`PAID_GATEWAYS_OPEN`, closed); the kind of engine reports what
# each turn costs, in `currency`, as a verified fact (`COST_REPORTING_KINDS`, empty: the Claude Code CLI prints only an
# estimate from a price table of its own); and the entry is on and not locked.
#
# When one does run, its limits are kept by the spend ledger (`engine-ledger.json` in the data directory):
#  - the two caps are for ALL paid engines together, in `currency`; a day and a month are counted in UTC;
#  - they are checked before each turn. At or over a cap the engine is skipped like a limited one and runs again when the day
#    or the month turns. A turn that crosses a cap while it runs finishes and counts, so what is spent can pass a cap by what
#    the turns already running cost;
#  - only what the engine itself reports is recorded. A turn with no stated cost is counted as unknown, and then the caps
#    cannot be checked: the engines stay held until the month turns, or until you delete the ledger file and restart (that
#    forgets what was spent: look at the provider's own usage page first). A damaged ledger file holds them too, and is never
#    read as "nothing spent": mend it or delete it.
metered:
  enabled: false
  currency: EUR
  daily_cap: 0
  monthly_cap: 0
  # enforce: ledger    # `none` (the default) or `ledger`: say that FreeDuet keeps these caps with its spend ledger

# Chains per member, tried in order. The router enforces the rule whatever the order written here:
# subscription engines first, then free, then metered. A metered engine can never be first.
chains:
  default: [claude-code, codex, local, anthropic-api]
  freeduet: [claude-code, codex, anthropic-api]   # Iris
  concierge: [claude-code, codex, anthropic-api]  # Jules: tier A only, it can reach a checkout
  chef: [claude-code, codex, local, openrouter]

# Minimum tier per member for specific skills or tools.
quality_floor:
  concierge:
    request_purchase: A
    book-an-appointment: A

# Assistants: light helpers every member can call for small jobs (summaries, extraction, translation...).
# Free engines only: they never use your subscriptions' limits or any metered API.
assistants:
  enabled: true
  chain: [local, openrouter-free]
  max_calls_per_turn: 10
  max_input_tokens: 32000
  tasks: [summarise, extract, classify, translate, reformat, proofread, draft-variants, tag]

# How a member's chain behaves when an engine cannot take a turn. Per member id (agents.yaml) or `default`.
# mode: automatic (the default: move to the next engine and say so) or ask-first (stop and ask the person).
# pin:  an engine id; that member never falls back to another engine and stops with a plain message instead.
# To switch an engine off for everyone, set `enabled: false` on it above.
# switching:
#   default: {mode: automatic}
#   concierge: {mode: ask-first}
#   freeduet: {pin: claude-code}
