    <script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "FAQPage",
 "inLanguage": "en",
 "mainEntity": [
  {
   "@type": "Question",
   "name": "What is free, and what do I pay for?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "FreeDuet is free and open source under the MIT licence, including for business use. You bring the monthly AI subscription you already have — today a Claude plan through the official Claude Code app. No pay-per-token API key meter to buy. Extra engines (free or local models) can be added on the Engines page; they are off by default, and only the Claude login has answered a real turn so far."
   }
  },
  {
   "@type": "Question",
   "name": "What do I need to install it?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "A Claude subscription plus Docker, Bash, and Bun on your computer. The maintainer runs it on Windows with WSL2, and CI starts it cleanly on Linux. It has not yet been tested on macOS. A one-file double-click installer is the top item in progress; the first-step install scripts for Ubuntu and Windows have not yet run on a clean machine."
   }
  },
  {
   "@type": "Question",
   "name": "Where does my data live?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "The app, database, and each assistant's isolated browser run on your own computer. By default your conversations stay stored locally there. To think, requests go to the AI service you signed in to (or any extra engine you manually enable on the Engines page)."
   }
  },
  {
   "@type": "Question",
   "name": "What can an assistant do without asking me?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "It can search, read, check, and prepare drafts and short reports. By default, Send, Pay, Sign, Book, and Delete pause for your approval card: a fixed rule matches the words, and a reviewer model checks the rest against what you typed. Exceptions: a brand-new email to an address you type yourself, standing mail rules you set (label, archive, mark read, move to Spam or the Bin only), and Full access if you switch it on for a member. Assistants can still make mistakes, so read every card before approving."
   }
  },
  {
   "@type": "Question",
   "name": "Can I add a custom assistant to the team?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "Yes. Ask Leo in chat to design a brand-new specialist for the exact job you need, or edit a member definition yourself. When a tool is missing, Leo lists its source and licence first and installs nothing without your yes."
   }
  },
  {
   "@type": "Question",
   "name": "Can I pair it from my phone?",
   "acceptedAnswer": {
    "@type": "Answer",
    "text": "v0.2.2 can pair a phone browser from your computer with a one-time code shown as a QR code; this ran once on the maintainer's own installation on 16 November 2026. Revoking a pairing and approving from the phone are not yet checked, and remote access from outside your home network is still in progress."
   }
  }
 ]
}

        <h1>FreeDuet: your own team of AI assistants</h1>
        <p>FreeDuet is a free, open-source team of AI assistants that runs on your own computer and your own AI subscription. By default they ask before they send, pay, sign, book or delete.</p>
        <p><a href="https://github.com/MarcoDeliaBot/freeduet">FreeDuet on GitHub</a> · <a href="https://github.com/MarcoDeliaBot/freeduet#quick-start">Quick start</a> · <a href="https://github.com/MarcoDeliaBot/freeduet/blob/main/docs/ROADMAP.md">Roadmap</a></p>
        <h2>Questions people ask first</h2>
        <h3>What is free, and what do I pay for?</h3><p>FreeDuet is free and open source under the MIT licence, including for business use. You bring the monthly AI subscription you already have — today a Claude plan through the official Claude Code app. No pay-per-token API key meter to buy. Extra engines (free or local models) can be added on the Engines page; they are off by default, and only the Claude login has answered a real turn so far.</p><h3>What do I need to install it?</h3><p>A Claude subscription plus Docker, Bash, and Bun on your computer. The maintainer runs it on Windows with WSL2, and CI starts it cleanly on Linux. It has not yet been tested on macOS. A one-file double-click installer is the top item in progress; the first-step install scripts for Ubuntu and Windows have not yet run on a clean machine.</p><h3>Where does my data live?</h3><p>The app, database, and each assistant's isolated browser run on your own computer. By default your conversations stay stored locally there. To think, requests go to the AI service you signed in to (or any extra engine you manually enable on the Engines page).</p><h3>What can an assistant do without asking me?</h3><p>It can search, read, check, and prepare drafts and short reports. By default, Send, Pay, Sign, Book, and Delete pause for your approval card: a fixed rule matches the words, and a reviewer model checks the rest against what you typed. Exceptions: a brand-new email to an address you type yourself, standing mail rules you set (label, archive, mark read, move to Spam or the Bin only), and Full access if you switch it on for a member. Assistants can still make mistakes, so read every card before approving.</p><h3>Can I add a custom assistant to the team?</h3><p>Yes. Ask Leo in chat to design a brand-new specialist for the exact job you need, or edit a member definition yourself. When a tool is missing, Leo lists its source and licence first and installs nothing without your yes.</p><h3>Can I pair it from my phone?</h3><p>v0.2.2 can pair a phone browser from your computer with a one-time code shown as a QR code; this ran once on the maintainer's own installation on 16 November 2026. Revoking a pairing and approving from the phone are not yet checked, and remote access from outside your home network is still in progress.</p>
