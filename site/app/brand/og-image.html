<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source of site/og-image.png (1200 x 630). Not served on purpose to anyone: it lives under site/app/brand/.
     Render it with: python3 site/app/scripts/render-brand.py   (Playwright). The mascots are the page's own
     FreeDuetMascot SVGs (node site/app/scripts/iris-markup.mjs <id> <size>), the logo is the nav logo. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0e1b33;--ink-soft:#51627d;--blue:#1b4fd8;--aqua:#4fd3d6;--mint:#0f8a64}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(44rem 30rem at 82% 46%,rgba(79,211,214,.26),transparent 64%),
      radial-gradient(34rem 26rem at 96% 100%,rgba(187,166,240,.30),transparent 66%),
      radial-gradient(30rem 20rem at 0% 0%,rgba(246,201,85,.16),transparent 64%),
      linear-gradient(135deg,#f3fbfc 0%,#f4f7ff 58%,#f6f1ff 100%)}
  .brand{position:absolute;left:76px;top:62px;display:flex;align-items:center;gap:16px}
  .brand svg{width:56px;height:56px;display:block}
  .brand span{font-family:"Schibsted Grotesk",sans-serif;font-weight:800;font-size:36px;letter-spacing:-.02em}
  .brand i{font-style:normal;color:#0b838a}
  .copy{position:absolute;left:76px;top:160px;width:640px}
  h1{font-family:"Schibsted Grotesk",sans-serif;font-weight:800;font-size:84px;line-height:1.03;letter-spacing:-.035em}
  h1 .acc{position:relative;display:inline-block;color:var(--blue)}
  h1 .acc svg{position:absolute;left:2px;bottom:-14px;width:100%;height:16px}
  .lead{margin-top:44px;max-width:580px;font-size:26px;line-height:1.45;color:var(--ink-soft);font-weight:500}
  .facts{position:absolute;left:76px;bottom:58px;display:flex;gap:34px;list-style:none;font-size:22px;font-weight:600;color:var(--ink)}
  .facts li{display:flex;align-items:center;gap:10px}
  .facts svg{width:24px;height:24px;flex:none}
  .stage{position:absolute;right:0;top:0;width:520px;height:630px}
  .ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%)}
  .r1{width:470px;height:470px;border:2px dashed #c5daf5}
  .r2{width:330px;height:330px;border:2px dashed #beecee}
  .disc{position:absolute;left:50%;top:50%;width:300px;height:300px;border-radius:50%;transform:translate(-50%,-50%);background:#fff;box-shadow:0 24px 60px rgba(24,58,128,.14)}
  .iris{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%)}
  .iris svg{width:330px!important;height:330px!important;display:block}
  .tile{position:absolute;background:#fff;border-radius:22px;box-shadow:0 14px 36px rgba(24,58,128,.13);padding:8px 8px 4px;text-align:center}
  .tile svg{width:92px!important;height:92px!important;display:block}
  .tile b{display:block;font-family:"Schibsted Grotesk",sans-serif;font-size:16px;font-weight:800;margin-top:-2px}
  .t1{left:12px;top:96px}.t2{right:30px;top:96px}.t3{left:20px;bottom:92px}.t4{right:24px;bottom:92px}
  .url{position:absolute;right:76px;bottom:58px;font-family:"Schibsted Grotesk",sans-serif;font-weight:700;font-size:26px;color:var(--ink-soft)}
</style>
</head>

    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#1B4FD8"/><circle cx="15.5" cy="20" r="7.2" stroke="#FFFFFF" stroke-width="3"/><circle cx="24.5" cy="20" r="7.2" stroke="#7AE8EA" stroke-width="3"/></svg>
    <span>FreeDuet<i>.</i></span>

  <div class="copy">
    <h1>Your own team of <span class="acc">AI assistants.<svg viewBox="0 0 340 16" preserveAspectRatio="none" fill="none"><path d="M 4 11 Q 92 2 174 9 T 336 7" stroke="url(#w)" stroke-width="6.5" stroke-linecap="round"/><defs><linearGradient id="w" x1="0" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#4FD3D6"/><stop offset="52%" stop-color="#1B4FD8"/><stop offset="100%" stop-color="#BBA6F0"/></linearGradient></defs></svg></span></h1>
