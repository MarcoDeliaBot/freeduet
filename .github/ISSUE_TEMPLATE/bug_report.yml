name: Bug report
description: Something does not work the way the README or the docs say.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in English or Italian.

        Never paste subscription credentials, or the contents of the Claude login folders.
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps, in order. Include the exact command or the button you pressed.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What you saw instead. Paste the exact error text if there is one.
    validations:
      required: true
  - type: dropdown
    id: member
    attributes:
      label: Which member was involved?
      options:
        - Iris
        - Leo
        - Otto
        - Portia
        - Penny
        - Jules
        - Wren
        - Gus
        - Basil
        - Vera
        - Not sure
        - None
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows with WSL2
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: started
    attributes:
      label: How was FreeDuet started?
      options:
        - scripts/start.sh
        - Docker image
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: For example v0.1, or the first 7 characters of the commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Paste only the lines around the error. Remove personal data first.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed passwords, tokens, email addresses and other personal data from what I pasted.
          required: true
