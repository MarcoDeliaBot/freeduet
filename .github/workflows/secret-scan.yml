name: security / secret scan

# gitleaks looks for secrets in the git history: API keys, tokens, passwords in URLs, private keys and
# cloud credentials, with the default rules plus the paths allowed in `.gitleaks.toml`.
#
# On a pull request it scans only the commits the pull request adds (base..head), so a secret pushed on
# a branch fails the pull request before it can reach main. On a push to main it scans the whole history,
# so anything that reached main by any route is caught.
#
# The binary is the pinned gitleaks release. It is downloaded and checked against its SHA-256 before it
# is unpacked, and the job stops if the check fails. Upgrading gitleaks means changing the version and the
# checksum together, from the release's own checksums file.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history is needed: the scan walks the commits, and the base commit of a pull request
          # must be present.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install gitleaks (pinned, SHA-256 checked)
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${work}"
          archive="${work}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" -C "${work}" gitleaks
          echo "${work}" >> "${GITHUB_PATH}"
          gitleaks version

      - name: Scan the commits of the pull request
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact --no-banner --exit-code 1

      - name: Scan the whole history of main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          gitleaks git . \
            --config .gitleaks.toml \
            --redact --no-banner --exit-code 1
