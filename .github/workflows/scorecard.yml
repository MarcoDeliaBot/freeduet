name: security / OpenSSF Scorecard

# The OpenSSF Scorecard scores how this repository is run (pinned dependencies, token permissions,
# branch protection, security policy, signed releases and so on) and publishes the result to the
# OpenSSF's public API. It runs on the default branch, on every push to it and once a week.
#
# The shape of this file is the action's, not ours: a workflow that publishes results may not set
# top-level env vars or defaults or any workflow-level write permission, only the job running the
# action may hold `id-token: write`, and the job may only use the actions listed in
# https://github.com/ossf/scorecard-action#workflow-restrictions. That is why it has no `run:` steps.

on:
  push:
    branches: [main]
  schedule:
    # Tuesdays, 05:13 UTC.
    - cron: "13 5 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to the OpenSSF API (`publish_results` below)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
